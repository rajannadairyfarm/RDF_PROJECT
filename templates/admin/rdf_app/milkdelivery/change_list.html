{% extends "admin/change_list.html" %}

{% block extrastyle %}
{{ block.super }}
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
    /* Ensure the object-tools container handles wrapping and spacing gracefully */
    .object-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
    }

    /* Custom styling for the Milk Operations button within Django's object-tools */
    .object-tools .btn-milk-ops {
        background-color: var(--default-button-bg, #417690);
        color: var(--button-fg, #fff);
        border-radius: 4px;
        padding: 5px 15px; /* Matches native Django admin padding */
        font-weight: 400;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: opacity 0.2s ease, background-color 0.2s ease;
        border: none;
        margin-bottom: 5px; /* Prevents vertical collision if wrapped */
    }
    
    .object-tools .btn-milk-ops:hover,
    .object-tools .btn-milk-ops:focus {
        background-color: var(--button-hover-bg, #205067);
        opacity: 0.9;
        color: var(--button-fg, #fff);
    }

    .object-tools .btn-milk-ops i {
        font-size: 14px;
    }
</style>
{% endblock %}

{% block object-tools %}
    <ul class="object-tools">
        <li>
            <a href="{% url 'admin:milk-operations-dashboard' %}" class="btn-milk-ops">
                <i class="ph-bold ph-drop"></i> Milk Operations
            </a>
        </li>

        {{ block.super }}
    </ul>
{% endblock %}
