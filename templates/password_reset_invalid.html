


<!DOCTYPE html>
<html lang="en"  class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Reset Link | Rajanna Dairy Farm</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Phosphor Icons for clean UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f3d26',    
                            primary: '#145c3a', 
                            light: '#2a7a50',   
                            milk: '#fdfdfc',    
                            cream: '#f4f4ec',   
                            sage: '#e6ede9',    
                            gold: '#d4af37',    
                            earth: '#5c4a3d',   
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #59db8d; /* Deeper, muted earthy-sage base */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #9fd58d 0%, #dce3de 50%, #d4af37 100%);
        }
        
        @keyframes floatOrbSlow {
            0% { transform: translateY(0px) scale(1); opacity: 0.15; }
            50% { transform: translateY(-20px) scale(1.05); opacity: 0.3; }
            100% { transform: translateY(0px) scale(1); opacity: 0.15; }
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }

        /* Form entrance animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glassmorphism utility for error states */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="text-brand-dark font-sans antialiased relative selection:bg-brand-primary selection:text-brand-milk">

    <!-- Background Orbs for subtle texture -->
    <div class="ambient-bg"></div>
    <div class="bg-orb w-96 h-96 bg-brand-light/20 top-0 left-0" style="animation: floatOrbSlow 12s ease-in-out infinite;"></div>
    <div class="bg-orb w-[30rem] h-[30rem] bg-brand-gold/15 bottom-0 right-0" style="animation: floatOrbSlow 15s ease-in-out infinite reverse;"></div>

    <!-- Centered Main Content Area (No Header/Footer) -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 min-h-screen relative z-10">
        
        <!-- Invalid Link Card -->
        <div class="max-w-md w-full glass-card rounded-[2rem] border border-red-100 p-8 sm:p-10 animate-slide-up relative overflow-hidden transition-all duration-500 shadow-[0_15px_40px_rgba(0,0,0,0.1)] border-t-4 !border-t-red-500 text-center">
            
            <!-- Soft red decorative corner accent -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-red-400/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="relative z-10">
                <!-- Icon -->
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-50 border border-red-100 mb-6 shadow-sm">
                    <i class="ph-fill ph-link-break text-5xl text-red-500"></i>
                </div>
                
                <!-- Heading -->
                <h1 class="text-3xl font-serif font-bold text-brand-dark mb-4">Invalid Link</h1>
                
                <!-- Dynamic Message injected via backend -->
                <p class="text-base text-brand-earth font-medium mb-8 leading-relaxed px-2">
                    {{ message }}
                </p>

                <!-- Action Buttons -->
                <div class="space-y-4">
                    <!-- Request New Link -->
                    <a href="{% url 'forgot-password' %}" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-brand-milk bg-gradient-to-r from-brand-primary to-brand-dark hover:from-brand-light hover:to-brand-primary hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
                        Request a New Reset Link
                    </a>
                    
                    <!-- Back to Login -->
                    <a href="{% url 'login' %}" class="w-full flex justify-center py-3.5 px-4 border border-brand-sage rounded-xl shadow-sm text-sm font-bold text-brand-dark bg-white hover:bg-brand-sage/50 hover:border-brand-primary/40 transition-all duration-200 group">
                        <i class="ph ph-arrow-left text-lg mr-2 group-hover:-translate-x-1 transition-transform"></i> Back to Login
                    </a>
                </div>
            </div>
            
        </div>
    </main>

</body>
</html>
