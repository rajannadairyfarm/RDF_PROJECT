

<!DOCTYPE html>
<html lang="en"  class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Rajanna Dairy Farm</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Icons (Phosphor Icons for clean UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f3d26',    
                            primary: '#145c3a', 
                            light: '#2a7a50',   
                            milk: '#fdfdfc',    
                            cream: '#f4f4ec',   
                            sage: '#e6ede9',    
                            gold: '#d4af37',    
                            earth: '#5c4a3d',   
                        }
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Lato', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #59db8d; /* Deeper, muted earthy-sage base */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(135deg, #9fd58d 0%, #dce3de 50%, #d4af37 100%);
        }
        
        @keyframes floatOrbSlow {
            0% { transform: translateY(0px) scale(1); opacity: 0.15; }
            50% { transform: translateY(-20px) scale(1.05); opacity: 0.3; }
            100% { transform: translateY(0px) scale(1); opacity: 0.15; }
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }

        /* Form entrance animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Glassmorphism utility */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        /* Input field autofill styling fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #0f3d26 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="text-brand-dark font-sans antialiased relative selection:bg-brand-primary selection:text-brand-milk">

    <!-- Background Orbs for subtle texture -->
    <div class="ambient-bg"></div>
    <div class="bg-orb w-96 h-96 bg-brand-light/20 top-0 left-0" style="animation: floatOrbSlow 12s ease-in-out infinite;"></div>
    <div class="bg-orb w-[30rem] h-[30rem] bg-brand-gold/15 bottom-0 right-0" style="animation: floatOrbSlow 15s ease-in-out infinite reverse;"></div>

    <!-- Centered Main Content Area (No Header/Footer) -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 min-h-screen relative z-10">
        
        <!-- Reset Password Card -->
        <div class="max-w-md w-full glass-card rounded-[2rem] border border-brand-sage p-8 sm:p-10 animate-slide-up relative overflow-hidden transition-all duration-500 hover:shadow-[0_8px_40px_rgba(20,92,58,0.08)]">
            
            <!-- Soft decorative corner accent -->
            <div class="absolute -top-16 -right-16 w-40 h-40 bg-brand-light/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <!-- Header Section -->
            <div class="text-center mb-8 relative z-10">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-cream border border-brand-sage mb-4 shadow-inner">
                    <i class="ph-fill ph-lock-key text-3xl text-brand-primary"></i>
                </div>
                <h1 class="text-3xl font-serif font-bold text-brand-dark mb-2">Reset Password</h1>
                <p class="text-sm text-brand-earth font-medium leading-relaxed px-2">
                    Enter your new password below to secure your account.
                </p>
            </div>

            <!-- ===================================== Django Messages ====================================== --> 
            {% if messages %}
                <div class="mb-6 space-y-3 relative z-10">
                    {% for message in messages %}
                        <div class="relative flex items-center justify-between p-4 rounded-xl shadow-sm text-sm font-medium animate-slide-up
                            {% if message.tags == 'error' %} 
                                bg-red-50/90 text-red-700 border border-red-200 
                            {% elif message.tags == 'success' %} 
                                bg-green-50/90 text-brand-primary border border-brand-sage 
                            {% elif message.tags == 'warning' %} 
                                bg-yellow-50/90 text-yellow-700 border border-yellow-200 
                            {% else %} 
                                bg-blue-50/90 text-blue-700 border border-blue-200 
                            {% endif %}" 
                            role="alert">

                            <span class="message-text flex items-center gap-2">
                                {% if message.tags == 'error' %}
                                    <i class="ph-fill ph-warning-circle text-lg"></i>
                                {% elif message.tags == 'success' %}
                                    <i class="ph-fill ph-check-circle text-lg"></i>
                                {% else %}
                                    <i class="ph-fill ph-info text-lg"></i>
                                {% endif %}
                                {{ message }}
                            </span>

                            <button 
                                type="button" 
                                class="ml-4 opacity-70 hover:opacity-100 transition-opacity focus:outline-none text-2xl leading-none" 
                                onclick="this.parentElement.remove();" 
                                aria-label="Close message">
                                &times;
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- ===================================== Reset Password Form ====================================== -->
            <form method="POST" action="" class="space-y-6 relative z-10">
                {% csrf_token %}

                <!-- New Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-brand-dark mb-1.5 ml-1">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="ph ph-lock-key text-brand-dark/40 text-xl"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            autocomplete="new-password" 
                            required
                            class="block w-full pl-11 pr-12 py-3 bg-brand-cream/50 border border-brand-sage rounded-xl text-brand-dark placeholder-brand-earth/50 focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary focus:bg-white transition-all shadow-sm"
                        >
                        <!-- Toggle Password Visibility -->
                        <button type="button" onclick="togglePassword('password', 'toggleIcon1')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-brand-dark/40 hover:text-brand-primary focus:outline-none transition-colors" aria-label="Toggle password visibility">
                            <i id="toggleIcon1" class="ph ph-eye text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm New Password Input -->
                <div>
                    <label for="confirm_password" class="block text-sm font-semibold text-brand-dark mb-1.5 ml-1">Confirm New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <i class="ph ph-lock-key text-brand-dark/40 text-xl"></i>
                        </div>
                        <input 
                            type="password" 
                            id="confirm_password" 
                            name="confirm_password" 
                            placeholder="••••••••" 
                            autocomplete="new-password" 
                            required
                            class="block w-full pl-11 pr-12 py-3 bg-brand-cream/50 border border-brand-sage rounded-xl text-brand-dark placeholder-brand-earth/50 focus:outline-none focus:ring-2 focus:ring-brand-primary/30 focus:border-brand-primary focus:bg-white transition-all shadow-sm"
                        >
                        <!-- Toggle Confirm Password Visibility -->
                        <button type="button" onclick="togglePassword('confirm_password', 'toggleIcon2')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-brand-dark/40 hover:text-brand-primary focus:outline-none transition-colors" aria-label="Toggle password visibility">
                            <i id="toggleIcon2" class="ph ph-eye text-xl"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center items-center py-3.5 px-4 border border-transparent rounded-xl shadow-md text-sm font-bold text-brand-milk bg-gradient-to-r from-brand-primary to-brand-dark hover:from-brand-light hover:to-brand-primary hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary">
                        Save New Password
                        <i class="ph ph-check-circle ml-2 text-lg"></i>
                    </button>
                </div>
            </form>
            
        </div>
    </main>

    <script>
        // Reusable Toggle Password Visibility Logic
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.replace('ph-eye', 'ph-eye-slash');
                toggleIcon.classList.add('text-brand-primary');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.replace('ph-eye-slash', 'ph-eye');
                toggleIcon.classList.remove('text-brand-primary');
            }
        }
    </script>
</body>
</html>
